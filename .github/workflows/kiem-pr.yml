name: kiem-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kiem-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kiem-pr:
    name: kiem-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Kiểm thân PR và log tác tử
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/kiem_pr.py
